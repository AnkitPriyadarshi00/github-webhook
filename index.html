<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to My GitHub Page</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6b73ff 0%, #000dff 100%);
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.2em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    p {
      font-size: 1.25rem;
      margin-bottom: 2em;
      max-width: 600px;
      line-height: 1.5;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }

    a.button {
      background-color: #ff7e5f;
      background-image: linear-gradient(45deg, #ff7e5f 0%, #feb47b 100%);
      padding: 15px 30px;
      border-radius: 30px;
      color: white;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    a.button:hover {
      background-color: #feb47b;
      box-shadow: 0 6px 20px rgba(255, 180, 130, 0.7);
    }

    footer {
      margin-top: auto;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2.2rem;
      }
      p {
        font-size: 1rem;
      }
      a.button {
        padding: 12px 24px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <h1>Welcome to My GitHub Page</h1>
  <p>This is a simple, elegant static website hosted on GitHub Pages. Update your content by pushing changes to your <code>main</code> branch.</p>
  <a href="https://github.com/AnkitPriyadarshi00" class="button" target="_blank" rel="noopener noreferrer">Visit My GitHub Profile</a>
  <footer>© 2025 Ankit Priyadarshi</footer>
</body>
</html>
