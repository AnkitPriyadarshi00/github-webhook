name: Webhook Test

on:
  push:
    branches:
      - main  # or your default branch

jobs:
  run-on-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Print commit message
      run: |
        echo "GitHub push event detected!"
        echo "Commit message: ${{ github.event.head_commit.message }}"
