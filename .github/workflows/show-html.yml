name: Show HTML file on push to main

on:
  push:
    branches:
      - main    # trigger only on pushes to main branch

jobs:
  show-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Display contents of index1.html
        run: |
          echo "----- index1.html content start -----"
          cat index1.html
          echo "----- index1.html content end -----"
