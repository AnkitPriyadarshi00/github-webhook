name: Trigger API via Python on push to main

on:
  push:
    branches:
      - main

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install requests

    - name: Run Python script to call external API
      run: |
        python3 <<EOF
        import requests
        import os

        url = "https://webhook.site/46837762-c5e5-4a80-81b2-12327c9175e0"
        headers = {
            "Content-Type": "application/json",
            #"Authorization": f"Bearer {os.getenv('MY_API_TOKEN')}"
        }

        payload = {
            "event": "git_push",
            "info": {
                "repo_url": "https://github.com/${{ github.repository }}",
                "commit_id": "${{ github.sha }}",
                "author": "${{ github.actor }}"
            }
        }

        try:
            response = requests.post(url, json=payload, headers=headers)
            print("Status:", response.status_code)
            print("Response:", response.text)
        except Exception as e:
            print("Failed to call API:", str(e))
        EOF
      env:
        MY_API_TOKEN: ${{ secrets.MY_API_TOKEN }}
